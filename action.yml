name: 'DeepSeek Harness Plugin Checker'
description: 'GitHub Action for checking the correctness of DeepSeek Harness (dsh) plugin.'
author: 'bowenliang123'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  rootPath:
    description: 'Path to the plugin root directory, relative to the checked-out repository. Defaults to the repository root.'
    required: false
    default: '.'
  profile:
    description: 'dsh profile to install the plugin into.'
    required: false
    default: 'web'
  dshVersion:
    description: 'Version of the @deepseek-ai/dsh npm package to install. Use "latest" for the newest release.'
    required: false
    default: 'latest'
  pnpmVersion:
    description: 'Version of pnpm to install. dsh plugin management runs pnpm internally.'
    required: false
    default: 'latest'
  nodeVersion:
    description: 'Node.js version to run the dsh CLI with.'
    required: false
    default: '24'
outputs:
  pluginName:
    description: 'The package name of the checked plugin.'
runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.nodeVersion }}

    - name: Install pnpm
      shell: bash
      run: npm install --global pnpm@${{ inputs.pnpmVersion }}

    - name: Install dsh CLI from npm
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/dsh-cli"
        npm install --prefix "$RUNNER_TEMP/dsh-cli" --no-save "@deepseek-ai/dsh@${{ inputs.dshVersion }}"

    - name: Install plugin with DeepSeek Harness CLI
      id: check
      shell: bash
      run: |
        set -euo pipefail

        ROOT_PATH="${{ inputs.rootPath }}"
        case "$ROOT_PATH" in
          /*) ;;
          *) ROOT_PATH="${GITHUB_WORKSPACE:-$PWD}/$ROOT_PATH" ;;
        esac

        "$RUNNER_TEMP/dsh-cli/node_modules/.bin/dsh" plugin --profile "${{ inputs.profile }}" add "$ROOT_PATH"

        PLUGIN_NAME="$(node -p 'require(process.argv[1]).name' "$ROOT_PATH/package.json")"
        echo "pluginName=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"
