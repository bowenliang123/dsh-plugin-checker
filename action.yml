name: 'DeepSeek Harness Plugin Checker'
description: 'GitHub Action for checking the correctness of DeepSeek Harness (dsh) plugin.'
author: 'bowenliang123'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  rootPath:
    description: 'Path to the plugin root directory, relative to the checked-out repository. Defaults to the repository root.'
    required: false
    default: '.'
  profile:
    description: 'dsh profile to install the plugin into.'
    required: false
    default: 'web'
  dshVersion:
    description: 'Version of the @deepseek-ai/dsh npm package to install. Use "latest" for the newest release.'
    required: false
    default: 'latest'
  pnpmVersion:
    description: 'Version of pnpm to install. dsh plugin management runs pnpm internally.'
    required: false
    default: 'latest'
  nodeVersion:
    description: 'Node.js version to run the dsh CLI with.'
    required: false
    default: '24'
runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.nodeVersion }}

    - name: Install pnpm
      shell: bash
      run: npm install --global pnpm@${{ inputs.pnpmVersion }}

    - name: Install dsh CLI from npm
      shell: bash
      run: npm install --global "@deepseek-ai/dsh@${{ inputs.dshVersion }}"

    - name: Check package.json exists
      shell: bash
      run: |
        set -euo pipefail
        test -f "./${{ inputs.rootPath }}/package.json" || { echo "::error::no package.json at ${{ inputs.rootPath }}"; exit 1; }

    - name: Check package.json is valid JSON
      shell: bash
      run: |
        set -euo pipefail
        jq -e . "./${{ inputs.rootPath }}/package.json" >/dev/null || { echo "::error::invalid JSON in ${{ inputs.rootPath }}/package.json"; exit 1; }

    - name: Check plugin name is declared
      shell: bash
      run: |
        set -euo pipefail
        jq -e '.name | type == "string" and length > 0' "./${{ inputs.rootPath }}/package.json" >/dev/null || { echo "::error::package.json must declare a non-empty \"name\""; exit 1; }

    - name: Check dsh.bundle.patch is declared
      shell: bash
      run: |
        set -euo pipefail
        jq -e '.dsh.bundle.patch | type == "string" and length > 0' "./${{ inputs.rootPath }}/package.json" >/dev/null || { echo "::error::not a dsh plugin — declare \"dsh\": { \"bundle\": { \"patch\": \"./cordis.patch.yml\" } }"; exit 1; }

    - name: Check the patch file exists
      shell: bash
      run: |
        set -euo pipefail
        PATCH="$(jq -r '.dsh.bundle.patch' "./${{ inputs.rootPath }}/package.json")"
        test -f "./${{ inputs.rootPath }}/$PATCH" || { echo "::error::dsh.bundle.patch references $PATCH, which does not exist under ${{ inputs.rootPath }}"; exit 1; }

    - name: Install plugin with dsh
      shell: bash
      run: dsh plugin --profile "${{ inputs.profile }}" add "./${{ inputs.rootPath }}"

    - name: Verify plugin layer applies
      shell: bash
      run: |
        set -euo pipefail
        PLUGIN_NAME="$(jq -r '.name' "./${{ inputs.rootPath }}/package.json")"
        dsh --profile "${{ inputs.profile }}" --dump-config | grep -qF "# == ${PLUGIN_NAME}" || {
          echo "::error::plugin ${PLUGIN_NAME} did not appear as a bundle layer of profile \"${{ inputs.profile }}\""
          exit 1
        }
        echo "plugin ${PLUGIN_NAME} loaded as a bundle layer of profile \"${{ inputs.profile }}\""
