name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  valid-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the example plugin
        uses: ./
        with:
          rootPath: examples/hello-plugin

  broken-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the broken plugin (must fail)
        id: check
        continue-on-error: true
        uses: ./
        with:
          rootPath: examples/broken-plugin
      - name: Assert the broken plugin was rejected
        if: steps.check.outcome == 'success'
        run: |
          echo "::error::the broken plugin unexpectedly passed the check"
          exit 1
